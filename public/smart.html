<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Controller</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.js"></script>
    <style>
      body { font-family: sans-serif; padding: 16px; }
      button { font-size: 18px; padding: 10px 14px; margin: 8px 0; }
      .box { padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h2>スマホコントローラ</h2>
    <div class="box">
      <div>ID: <span id="myid"></span></div>
      <button id="perm">① センサー許可</button>
      <button id="join">② ルーム参加</button>
      <div>gamma(g): <span id="g">0</span></div>
      <div>beta(b): <span id="b">0</span></div>
      <div style="font-size:12px;color:#666;">iPhoneは①が必須のこと多い</div>
    </div>

    <script>
      const socket = io.connect();

      let myid = sessionStorage.getItem("clientId");
      if (!myid) {
        myid = Math.random().toString(36).substring(2, 15);
        sessionStorage.setItem("clientId", myid);
      }
      document.querySelector("#myid").textContent = myid;

      let joined = false;

      async function request_permission() {
        try {
          if (DeviceMotionEvent?.requestPermission) await DeviceMotionEvent.requestPermission();
          if (DeviceOrientationEvent?.requestPermission) await DeviceOrientationEvent.requestPermission();
          alert("センサー許可OK");
        } catch (e) {
          alert("許可に失敗 or 不要: " + e);
        }
      }

      document.querySelector("#perm").addEventListener("click", request_permission);
      document.querySelector("#join").addEventListener("click", () => {
        socket.emit("join", "game");
        joined = true;
        alert("room(game)に参加しました");
      });

      window.addEventListener("deviceorientation", (e) => {
        const g = e.gamma ?? 0;
        const b = e.beta ?? 0;

        document.querySelector("#g").textContent = g.toFixed(1);
        document.querySelector("#b").textContent = b.toFixed(1);

        if (!joined) return;
        socket.emit("sensor", { room: "game", id: myid, g, b });
      });
    </script>
  </body>
</html>
